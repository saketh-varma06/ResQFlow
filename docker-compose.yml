# ResQFlow runs on MongoDB Atlas (cloud) — no database container is needed.
# The backend reads MONGODB_URI from the environment / root .env file.
# (The pre-cutover PostgreSQL service was removed in the MongoDB cutover;
# it remains in git history.)
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: resqflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to your MongoDB Atlas connection string}
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_local_secret}
    ports:
      - "4000:4000"
    profiles: ["full"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: resqflow-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    profiles: ["full"]
