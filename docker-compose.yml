services:
  postgres:
    image: postgres:16-alpine
    container_name: resqflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resqflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resqflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-resqflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - resqflow_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resqflow} -d ${POSTGRES_DB:-resqflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: resqflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-resqflow}:${POSTGRES_PASSWORD:-resqflow_dev_password}@postgres:5432/${POSTGRES_DB:-resqflow}?schema=public
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_local_secret}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: resqflow-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    profiles: ["full"]

volumes:
  resqflow_postgres_data:
    name: resqflow_postgres_data
